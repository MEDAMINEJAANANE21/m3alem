<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Commander un service – M3alem.ma</title>
    <link rel="icon" href="/img/logo.png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/layout.css" />
    <link rel="stylesheet" href="/src/styles/pages/services.page.css" />
  </head>
  <body>
    <header id="site-header"></header>

    <main class="page container">
      <h1 class="page__title">Nos services à domicile</h1>

      <div class="catalog">
        <section class="catalog__categories" aria-label="Catalogue">
          <div id="catalog-feedback"></div>
          <div id="categories" aria-live="polite">
            <p class="text-muted">Chargement du catalogue…</p>
          </div>
        </section>

        <aside class="cart" aria-labelledby="cart-title">
          <h2 id="cart-title" class="cart__title">
            <i class="bi bi-cart3" aria-hidden="true"></i>
            <span>Panier (<span id="cart-count">0</span>)</span>
          </h2>
          <ul id="cart-items" class="cart__items"></ul>
          <p class="cart__total">Total estimé : <strong id="cart-total">0 €</strong></p>

          <form id="checkout-form" class="cart__checkout" novalidate>
            <h3>Rendez-vous</h3>
            <label class="form-label" for="checkout-date">Date et heure</label>
            <input
              class="form-control"
              type="datetime-local"
              id="checkout-date"
              name="scheduledAt"
              required
            />

            <label class="form-label" for="checkout-address">Adresse</label>
            <input
              class="form-control"
              id="checkout-address"
              name="address"
              required
              minlength="5"
              maxlength="200"
              autocomplete="street-address"
            />

            <label class="form-label" for="checkout-phone">Téléphone (optionnel)</label>
            <input
              class="form-control"
              type="tel"
              id="checkout-phone"
              name="phone"
              maxlength="20"
              autocomplete="tel"
            />

            <label class="form-label" for="checkout-notes">Précisions (optionnel)</label>
            <textarea
              class="form-control"
              id="checkout-notes"
              name="notes"
              rows="2"
              maxlength="500"
            ></textarea>

            <button id="checkout-button" class="btn btn-primary w-100 mt-3" type="submit">
              Passer la commande
            </button>
          </form>
          <div id="checkout-feedback" class="mt-3" aria-live="polite"></div>
        </aside>
      </div>
    </main>

    <footer id="site-footer"></footer>

    <script type="module" src="/src/pages/services.page.js"></script>
  </body>
</html>
