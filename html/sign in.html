<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M3alem.ma</title>
  <link rel="stylesheet" href="/css/signin.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

 
  <header>
    <div class="logo">
        <a href="/html/Accueil.html"><img src="/templates/m3alem.ma1.png" alt="Logo M3alem" class="logo-img" /> </a></div>
    <nav class="nav-links">
        <a href="/html/Accueil.html">Accueil</a>
        <a href="/html/Accueil.html#comment">comment ça marche</a>
        <a href="/html/Accueil.html#apropos">À propos</a>

        <a href="/html/electri.html">commander</a>
        <a href="/html/contact.html">Contact</a>
    </nav>
    <div class="nav-actions">
        <a href="sign in.html" class="login">Login</a>
    
    </div>
</header>

  <!-- Main -->
  <div class="auth-container">
    <div class="auth-tabs">
      <button class="tab active" onclick="showForm('login')">Sign In</button>
      <button class="tab" onclick="showForm('register')">Register</button>
    </div>
  
    <!-- Login Form -->
    <form id="login-form" class="auth-form">
      <input type="email" placeholder="Email" required />
      <input type="password" placeholder="Password" required />
      <button type="submit">Sign In</button>
    </form>
  
    <!-- Register Form -->
    <form id="register-form" class="auth-form hidden">
      <input type="text" placeholder="Full Name" required />
      <input type="email" placeholder="Email" required />
      <input type="password" placeholder="Password" required />
      <input type="password" placeholder="Confirm Password" required />
      <button type="submit">Register</button>
    </form>
  </div>

  <footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center">
      <div class="mb-3">
        <a href="https://www.facebook.com" target="_blank" class="text-white me-4">
          <i class="bi bi-facebook" style="font-size: 1.5rem;"></i>
        </a>
        <a href="https://www.instagram.com" target="_blank" class="text-white me-4">
          <i class="bi bi-instagram" style="font-size: 1.5rem;"></i>
        </a>
        <a href="https://twitter.com" target="_blank" class="text-white me-4">
          <i class="bi bi-twitter-x" style="font-size: 1.5rem;"></i>
        </a>
        <a href="https://wa.me/212600000000" target="_blank" class="text-white me-4">
          <i class="bi bi-whatsapp" style="font-size: 1.5rem;"></i>
        </a>
      </div>
      <p class="mb-0">© 2025 M3alem.ma - Tous droits réservés</p>
    </div>
  </footer>
  
  <script src="/java/signin.js"></script>
</body>
</html>
